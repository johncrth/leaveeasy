<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script type="module" src="js/leave-request-detail.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>รายละเอียดใบลา</h1>

    <div id="กล่องใบลา" class="card">
      <p>กำลังโหลดข้อมูล…</p>
    </div>

    <!-- 🤖 ผู้ช่วย AI ระดับที่ 2 — อ่านหลายที่แล้วสรุปให้หัวหน้าอ่านก่อนกดอนุมัติ -->
    <div id="กล่องAI" class="card hidden">
      <h2>🤖 ผู้ช่วยสรุปใบลาให้หัวหน้า</h2>
      <p class="hint">
        AI จะไปอ่าน 3 อย่างให้เอง — ใบลาใบนี้ · ประวัติการลาที่ผ่านมาของผู้ขอลาคนนี้ ·
        ความเห็นที่เขียนไว้แล้ว — จากนั้นสรุปเป็นข้อ ๆ ให้อ่านก่อนตัดสินใจ
      </p>
      <div class="btn-row">
        <button type="button" id="ปุ่มAIสรุป">ให้ AI สรุปใบลานี้ให้หัวหน้าอ่าน</button>
      </div>
      <div id="ผลสรุปAI" class="alert alert-ai hidden"></div>
      <div id="ขั้นตอนAI" class="hidden"></div>
    </div>

    <div id="กล่องความเห็น" class="card hidden">
      <h2>ความเห็นการอนุมัติ</h2>
      <div id="รายการความเห็น"></div>

      <label for="ข้อความความเห็น">เขียนความเห็นใหม่</label>
      <textarea id="ข้อความความเห็น" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
      <div id="เตือนความเห็น" class="alert alert-error hidden"></div>
      <div class="btn-row">
        <button type="button" id="ปุ่มส่งความเห็น">ส่งความเห็น</button>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="leave-requests.html">← กลับไปหน้ารายการ</a>
    </div>
  </div>
</body>
</html>
